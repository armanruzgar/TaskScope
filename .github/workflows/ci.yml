name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash runs with -eo pipefail, so a failing command piped into
    # tee still fails its step.
    shell: bash

jobs:
  gate:
    name: Quality gate
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Script syntax
        run: for f in script/*.sh; do bash -n "$f"; done

      - name: Build with warnings as errors
        run: swift build -c debug -Xswiftc -warnings-as-errors 2>&1 | tee build.log

      - name: Test
        run: swift test 2>&1 | tee test.log

      - name: Strict concurrency
        run: >-
          swift test --scratch-path .build/strict
          -Xswiftc -warnings-as-errors
          -Xswiftc -warn-concurrency
          -Xswiftc -enable-actor-data-race-checks
          2>&1 | tee strict.log

      # Some concurrency diagnostics stay warnings even under
      # -warnings-as-errors, so fail on any Swift compiler warning in the logs.
      # Compiler diagnostics carry a column (file.swift:12:5: warning:);
      # SwiftUI runtime messages printed while tests run do not
      # (file.swift:12: warning:), so they are not matched.
      - name: No compiler warnings
        run: |
          if grep -hE '\.swift:[0-9]+:[0-9]+: warning:' build.log test.log strict.log; then
            echo "::error::Swift compiler warnings found (listed above)."
            exit 1
          fi
